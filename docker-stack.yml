version: "3.8"
services:

  web1:
    image: nginx
    ports:
      - "8000:80"
    deploy:
      replicas: 3


  web2:
    image: durgaprasaduniq/swarm:v6
    ports:
      - "8081:8080"
    deploy:
      replicas: 2

  web3:
    image: tomcat
    ports:
      - "8090:8080"
    deploy:
     replicas: 3
