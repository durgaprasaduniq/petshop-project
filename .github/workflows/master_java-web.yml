
name: Build and Deploy Pet Shop to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Pet Shop
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: maven

      - name: Build Pet Shop
        run: mvn clean package

      - name: Check generated JAR
        run: ls -lh target/*.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: petshop-app
          path: target/*.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: petshop-app
          path: artifact/

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C5D547CB22ED48E8876E0EAD7B5EB491 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2734BA68361F4EE3878B7688912D9A64 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9067512251DB4278A8A48BC1E1B80E86 }}

      - name: Deploy Pet Shop
        uses: azure/webapps-deploy@v3
        with:
          app-name: java-web
          package: artifact/*.jar
